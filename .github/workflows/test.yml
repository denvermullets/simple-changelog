name: Test Simple Changelog Action

on:
  push:
    branches:
      - dev

jobs:
  test-action:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v3

      - name: Run the Action
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display Updated CHANGELOG.md
        run: cat CHANGELOG.md
